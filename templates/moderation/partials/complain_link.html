{% if user.is_authenticated %}
  <a class="link-action" href="{{ url }}" hx-get="{{ url }}" hx-target="#modal-content">{% icon "flag" 16 %}{{ label }}</a>
{% else %}
  <a class="link-action" href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}">{% icon "flag" 16 %}{{ label }}</a>
{% endif %}
