<div class="modal__header">
  <h2 class="modal__title" id="modal-title">Жалоба отправлена</h2>
  <button class="btn btn--ghost btn--icon btn--sm" type="button" data-close-dialog aria-label="Закрыть">{% icon "x" %}</button>
</div>
<div class="modal__body">
  <p>Спасибо. Модератор разберётся в течение рабочего дня и, если нарушение подтвердится, пришлёт уведомление.</p>
</div>
<div class="modal__footer">
  <button class="btn btn--primary" type="button" data-close-dialog autofocus>Хорошо</button>
</div>
