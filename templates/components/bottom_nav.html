{% url 'core:home' as home_url %}
{% url 'core:city_select' as city_url %}
<nav class="bottom-nav" aria-label="Основная навигация">
  <a class="bottom-nav__item" href="{{ home_url }}"{% if request.path == home_url %} aria-current="page"{% endif %}>
    {% icon "house" 22 %}<span>Главная</span>
  </a>
  <a class="bottom-nav__item" href="{{ city_url }}?next={{ request.get_full_path|urlencode }}"{% if request.path == city_url %} aria-current="page"{% endif %}>
    {% icon "map-pin" 22 %}<span>{% if current_city %}{{ current_city.name|truncatechars:12 }}{% else %}Все города{% endif %}</span>
  </a>
  <button class="bottom-nav__item" type="button" data-open-dialog="menu-dialog">
    {% icon "menu" 22 %}<span>Меню</span>
  </button>
</nav>
