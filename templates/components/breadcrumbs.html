<nav class="breadcrumbs" aria-label="Навигационная цепочка">
  <ol>
    <li><a href="{% url 'ads:home' %}">Главная</a></li>
    {% for label, url in breadcrumbs %}
      <li>{% if url and not forloop.last %}<a href="{{ url }}">{{ label }}</a>{% else %}<span aria-current="page">{{ label }}</span>{% endif %}</li>
    {% endfor %}
  </ol>
</nav>
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Главная", "item": "{{ site_url }}/"}{% for label, url in breadcrumbs %}, {"@type": "ListItem", "position": {{ forloop.counter|add:1 }}, "name": "{{ label|escapejs }}"{% if url %}, "item": "{{ site_url }}{{ url|escapejs }}"{% endif %}}{% endfor %}]}
</script>
