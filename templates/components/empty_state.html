<div class="empty-state">
  <div class="empty-state__icon">{% icon icon_name|default:"search-x" 32 %}</div>
  <h2>{{ title }}</h2>
  {% if text %}<p>{{ text }}</p>{% endif %}
  {% if action_url %}
    <div class="cluster"><a class="btn btn--primary" href="{{ action_url }}">{{ action_label }}</a></div>
  {% endif %}
</div>
