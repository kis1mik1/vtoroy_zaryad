<dialog class="modal" id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <div class="modal__header">
      <h2 class="modal__title" id="confirm-title">Подтвердите действие</h2>
    </div>
    <div class="modal__body">
      <p id="confirm-text"></p>
    </div>
    <div class="modal__footer">
      <button class="btn btn--secondary" value="cancel" autofocus>Отмена</button>
      <button class="btn btn--danger" value="confirm" id="confirm-accept">Подтвердить</button>
    </div>
  </form>
</dialog>
