{% extends "layouts/auth.html" %}

{% block title %}Регистрация{% endblock %}

{% block card %}
  <header class="auth__header">
    <h1>Регистрация</h1>
    <p>Размещайте объявления бесплатно и договаривайтесь в чате.</p>
  </header>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form }}
    {% captcha %}
    <button class="btn btn--primary btn--block btn--lg" type="submit">Зарегистрироваться</button>
  </form>
{% endblock %}

{% block after_card %}
  <p class="auth__switch">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
{% endblock %}
